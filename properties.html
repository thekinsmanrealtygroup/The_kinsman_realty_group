      margin-left: 2rem;
      font-weight: 500;
      color: var(--navy);

    .nav-links a:hover, .nav-links a.active { color: var(--gold); }
    .mobile-menu { display: none; font-size: 1.5rem; cursor: pointer; }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .mobile-menu { display: block; }
    }
    .hero {
      background: linear-gradient(107deg, rgba(11,43,68,0.92) 0%, rgba(11,43,68,0.7) 100%), url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=2070&q=80');

      background-position: center;
      padding: 60px 0;
      text-align: center;
      color: white;
    }
    .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .hero p { font-size: 1.1rem; opacity: 0.9; }
    .tabs {
      display: flex;
      gap: 1rem;
      margin: 2rem 0 1rem;
      border-bottom: 2px solid var(--gray-border);
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      color: #4a5568;
      transition: all 0.2s;

    .tab-btn.active {
      color: var(--gold);
      border-bottom: 3px solid var(--gold);
      margin-bottom: -2px;
    }
    .properties-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin: 2rem 0;
    }
    .property-card {

      border-radius: 1rem;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s ease;
      border: 1px solid var(--gray-border);
    }
    .property-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
    .card-img {
      height: 220px;
      width: 100%;
      object-fit: cover;
      cursor: pointer;
    }
    .card-details { padding: 1.2rem; }
    .price { font-size: 1.5rem; font-weight: 700; color: var(--gold); margin-bottom: 0.25rem; }
    .address { font-size: 0.8rem; color: #4a5568; margin: 0.25rem 0; display: flex; align-items: center; gap: 5px; }
    .desc { font-size: 0.85rem; margin: 0.5rem 0; color: #2d3e50; min-height: 60px; }
    .features { display: flex; gap: 1rem; font-size: 0.8rem; margin: 0.5rem 0; color: #4a5568; }
    .owner-badge {

      align-items: center;
      gap: 8px;
      margin: 10px 0 5px;
      padding: 6px 0;
      border-top: 1px solid var(--gray-border);

    .owner-img {

      height: 32px;
      border-radius: 50%;
      object-fit: cover;

    .owner-name { font-size: 0.75rem; font-weight: 500; }
    .btn-group { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .contact-btn, .apply-btn {

      padding: 8px 0;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
      border: none;

      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;

      border-radius: 1.5rem;

      width: 90%;
      padding: 1.5rem;
      text-align: center;
      position: relative;

    .contact-options { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
    .contact-option {

      align-items: center;
      gap: 1rem;
      padding: 12px;
      background: var(--gray-light);
      border-radius: 60px;
      text-decoration: none;
      color: var(--navy);

    .contact-option:hover { background: var(--gold); color: white; }
    .property-modal {

      position: fixed;

      justify-content: center;
      align-items: center;
      overflow-y: auto;

      width: 90%;

      padding: 1.5rem;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .close-property-modal {
      position: absolute;
      right: 1.2rem;
      top: 1rem;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .gallery-thumb {
      display: flex;
      gap: 0.5rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .gallery-thumb img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }
    .main-modal-img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 1rem;
    }
    .owner-section {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1rem 0;
      padding: 1rem;
      background: var(--gray-light);
      border-radius: 1rem;
    }
    .owner-section img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }
    .about-house {
      background: #fef9e6;
      padding: 0.8rem;
      border-radius: 1rem;

    }
    footer {
      background: var(--navy);

</head>

  function generateImages() {

    return set.map(url => url + "?w=800");

  // Generate images for all listings
  for (let i = 0; i < saleListings.length; i++) saleListings[i].images = generateImages();
  for (let i = 0; i < rentalListings.length; i++) rentalListings[i].images = generateImages();

  // ======================= RENDER FUNCTIONS ================================
  let currentTab = "rent";
  function formatPrice(price, isRent) { return isRent ? `$${price.toLocaleString()}/mo` : `$${price.toLocaleString()}`; }
  
  function renderProperties() {
    const container = document.getElementById("propertiesContainer");
    const data = currentTab === "rent" ? rentalListings : saleListings;
    const isRent = currentTab === "rent";
    if (!data || data.length === 0) { container.innerHTML = "<div style='text-align:center; padding:3rem;'>No listings yet.</div>"; return; }
    container.innerHTML = data.map(prop => `
      <div class="property-card">
        <img class="card-img" src="${prop.images[0]}" alt="Property">
        <div class="card-details">
          <div class="price">${formatPrice(prop.price, isRent)}</div>
          <div class="address"><i class="fas fa-map-pin" style="color: var(--gold);"></i> ${prop.address}</div>
          <div class="desc">${prop.desc}</div>
          <div class="features"><span><i class="fas fa-bed"></i> ${prop.beds} bd</span><span><i class="fas fa-bath"></i> ${prop.baths} ba</span><span>📐 ${prop.sqft} sqft</span></div>
          <div class="owner-badge"><img class="owner-img" src="${prop.ownerImg}"><span class="owner-name">Host: ${prop.ownerName}</span></div>
          <div class="btn-group"><button class="contact-btn" data-address="${prop.address.replace(/"/g, '&quot;')}"><i class="fas fa-headset"></i> Contact Landlord</button><button class="apply-btn"><i class="fas fa-file-signature"></i> Apply Now</button></div>
        </div>
      </div>
    `).join("");
    document.querySelectorAll(".contact-btn").forEach(btn => btn.addEventListener("click", e => openContactPopup(btn.dataset.address)));
    document.querySelectorAll(".apply-btn").forEach(btn => btn.addEventListener("click", () => openGoogleForm()));
    document.querySelectorAll(".card-img").forEach((img, idx) => img.addEventListener("click", () => showPropertyGallery(data[idx])));
  }
  
  function showPropertyGallery(prop) {
    const modal = document.getElementById("propertyModal");
    const contentDiv = document.getElementById("propertyModalContent");
    let thumbs = "";
    for (let i=0; i<prop.images.length; i++) thumbs += `<img src="${prop.images[i]}" data-img="${prop.images[i]}">`;
    const isRent = currentTab === "rent";
    contentDiv.innerHTML = `<h2>${prop.address}</h2><div class="price">${formatPrice(prop.price, isRent)}</div><img class="main-modal-img" id="modalMainImg" src="${prop.images[0]}"><div class="gallery-thumb" id="galleryThumbs">${thumbs}</div><div class="owner-section"><img src="${prop.ownerImg}"><div><strong>${prop.ownerName}</strong><br>Property host</div></div><div class="about-house">${prop.aboutHouse}</div><div class="features"><span>🛏️ ${prop.beds} beds</span><span>🛁 ${prop.baths} baths</span><span>📐 ${prop.sqft} sqft</span></div><div class="btn-group"><button class="contact-btn" id="modalContactBtn">Contact Landlord</button><button class="apply-btn" id="modalApplyBtn">Apply Now</button></div>`;
    modal.style.display = "flex";
    document.getElementById("modalContactBtn").onclick = () => openContactPopup(prop.address);
    document.getElementById("modalApplyBtn").onclick = () => openGoogleForm();
    const thumbsImgs = document.querySelectorAll("#galleryThumbs img");
    const mainImg = document.getElementById("modalMainImg");
    thumbsImgs.forEach(t => t.addEventListener("click", () => mainImg.src = t.dataset.img));
  }
  
  function openContactPopup(addr) {
    const p = document.getElementById("contactPopup");

    document.getElementById("popupEmail").href = "mailto:thekinsmanrealtygroup@proton.me?subject=Inquiry about " + encodeURIComponent(addr);

    document.getElementById("popupPhone").href = "tel:+13852813672";
    p.style.display = "flex";

  function closeContactPopup() { document.getElementById("contactPopup").style.display = "none"; }
  function openGoogleForm() { window.open(GOOGLE_FORM_URL, "_blank"); setTimeout(() => alert("✅ Application form opened."), 200); }

  document.getElementById("tabRentBtn").addEventListener("click", () => { currentTab = "rent"; document.getElementById("tabRentBtn").classList.add("active"); document.getElementById("tabSaleBtn").classList.remove("active"); renderProperties(); });
  document.getElementById("tabSaleBtn").addEventListener("click", () => { currentTab = "sale"; document.getElementById("tabSaleBtn").classList.add("active"); document.getElementById("tabRentBtn").classList.remove("active"); renderProperties(); });
  document.getElementById("closePopup").addEventListener("click", closeContactPopup);
  window.addEventListener("click", (e) => { if (e.target === document.getElementById("contactPopup")) closeContactPopup(); if (e.target === document.getElementById("propertyModal")) document.getElementById("propertyModal").style.display = "none"; });
  document.getElementById("closePropertyModal").addEventListener("click", () => document.getElementById("propertyModal").style.display = "none");
  const mobileBtn = document.getElementById("mobileMenu"), navLinks = document.getElementById("navLinks");
  if(mobileBtn) mobileBtn.addEventListener("click", () => navLinks.style.display = navLinks.style.display === "flex" ? "none" : "flex");
  renderProperties();
</script>
</body>
  </html>
